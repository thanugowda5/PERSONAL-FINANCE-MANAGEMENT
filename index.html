<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Finance Manager</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fa;
padding:18px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:20px;
color:#2c3e50;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
text-align:center;
}

.card h2{
margin-bottom:10px;
}

.income{
color:green;
}

.expense{
color:red;
}

.balance{
color:blue;
}

form{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
background:#3498db;
color:white;
padding:12px;
border:none;
width:100%;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#2980b9;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,.15);
margin-top:20px;
}

table th,table td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

.delete{
background:red;
padding:6px 12px;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

.chartBox{
background:white;
margin-top:20px;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.alert{
margin-top:15px;
font-size:20px;
font-weight:bold;
text-align:center;
color:red;
}

</style>
</head>

<body>

<div class="container">

<h1>💰 Personal Finance Manager</h1>

<div class="dashboard">

<div class="card">
<h2>Total Income</h2>
<h3 id="income">₹0</h3>
</div>

<div class="card">
<h2>Total Expense</h2>
<h3 id="expense">₹0</h3>
</div>

<div class="card">
<h2>Balance</h2>
<h3 id="balance">₹0</h3>
</div>

</div>

<form id="financeForm">

<input type="number" id="amount" placeholder="Amount" required>

<select id="type">

<option value="Income">Income</option>

<option value="Expense">Expense</option>

</select>

<select id="category">

<option>Salary</option>

<option>Food</option>

<option>Travel</option>

<option>Shopping</option>

<option>Bills</option>

<option>Others</option>

</select>

<input type="date" id="date" required>

<input type="text" id="description" placeholder="Description">

<button>Add Transaction</button>

</form>

<div class="alert" id="budgetAlert"></div>

<table>

<thead>

<tr>

<th>Date</th>

<th>Type</th>

<th>Category</th>

<th>Description</th>

<th>Amount</th>

<th>Action</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<div class="chartBox">

<canvas id="pieChart"></canvas>

</div>

<div class="chartBox">

<canvas id="barChart"></canvas>

</div>

<script>

let transactions = JSON.parse(localStorage.getItem("finance")) || [];

const form=document.getElementById("financeForm");
const table=document.getElementById("tableBody");
const income=document.getElementById("income");
const expense=document.getElementById("expense");
const balance=document.getElementById("balance");
const alertBox=document.getElementById("budgetAlert");

const budget=10000;
function saveData(){
    localStorage.setItem("finance", JSON.stringify(transactions));
}

function updateDashboard(){

    let totalIncome = 0;
    let totalExpense = 0;

    transactions.forEach(item=>{
        if(item.type==="Income"){
            totalIncome += Number(item.amount);
        }else{
            totalExpense += Number(item.amount);
        }
    });

    income.innerHTML = "₹"+totalIncome;
    expense.innerHTML = "₹"+totalExpense;
    balance.innerHTML = "₹"+(totalIncome-totalExpense);

    let remaining = budget-totalExpense;

    if(remaining<=1000){
        alertBox.innerHTML="⚠ Budget Alert! Only ₹"+remaining+" left";
    }else{
        alertBox.innerHTML="";
    }

    drawCharts(totalIncome,totalExpense);
}

function displayTransactions(){

    table.innerHTML="";

    transactions.forEach((item,index)=>{

        table.innerHTML += `
        <tr>
            <td>${item.date}</td>
            <td>${item.type}</td>
            <td>${item.category}</td>
            <td>${item.description}</td>
            <td>₹${item.amount}</td>
            <td>
                <button class="delete" onclick="deleteTransaction(${index})">
                Delete
                </button>
            </td>
        </tr>
        `;

    });

}

function deleteTransaction(index){

    transactions.splice(index,1);

    saveData();

    displayTransactions();

    updateDashboard();

}

form.addEventListener("submit",function(e){

    e.preventDefault();

    let transaction={

        amount:document.getElementById("amount").value,

        type:document.getElementById("type").value,

        category:document.getElementById("category").value,

        date:document.getElementById("date").value,

        description:document.getElementById("description").value

    };

    transactions.push(transaction);

    saveData();

    displayTransactions();

    updateDashboard();

    form.reset();

});
// ---------- Charts ----------

let pieChart;
let barChart;

function drawCharts(totalIncome, totalExpense){

    const pieCtx = document.getElementById("pieChart").getContext("2d");
    const barCtx = document.getElementById("barChart").getContext("2d");

    if(pieChart){
        pieChart.destroy();
    }

    if(barChart){
        barChart.destroy();
    }

    pieChart = new Chart(pieCtx,{
        type:"pie",
        data:{
            labels:["Income","Expense"],
            datasets:[{
                data:[totalIncome,totalExpense],
                backgroundColor:[
                    "#2ecc71",
                    "#e74c3c"
                ]
            }]
        },
        options:{
            responsive:true
        }
    });

    barChart = new Chart(barCtx,{
        type:"bar",
        data:{
            labels:["Income","Expense"],
            datasets:[{
                label:"Amount (₹)",
                data:[totalIncome,totalExpense],
                backgroundColor:[
                    "#3498db",
                    "#f39c12"
                ]
            }]
        },
        options:{
            responsive:true,
            scales:{
                y:{
                    beginAtZero:true
                }
            }
        }
    });

}

// ---------- Load Saved Data ----------

displayTransactions();
updateDashboard();

// ---------- Monthly Report ----------

function monthlyReport(){

    let month = new Date().getMonth() + 1;

    let incomeTotal = 0;
    let expenseTotal = 0;

    transactions.forEach(item=>{

        let itemMonth = new Date(item.date).getMonth()+1;

        if(itemMonth === month){

            if(item.type==="Income"){
                incomeTotal += Number(item.amount);
            }else{
                expenseTotal += Number(item.amount);
            }

        }

    });

    console.log("Monthly Income:",incomeTotal);
    console.log("Monthly Expense:",expenseTotal);

}

// Run report
monthlyReport();

</script>

</body>

</html>
